name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Lets any branch be deployed on demand from the Actions tab, which is how a
  # revamp branch gets previewed without merging it first.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
    VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reports where Pages will actually serve this repo: "/" behind a custom
      # domain such as esnskovde.org, "/<repo>" for a project page. The build
      # needs it, or every asset URL points at the wrong place and the site
      # renders blank.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with SSG
        run: npm run build:ssg
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # A project-page deploy is a preview, not the real site. Its pages carry
      # canonical URLs pointing at esnskovde.org, so letting a crawler index it
      # would put a second copy of the site in front of the first.
      - name: Keep previews out of search
        if: steps.pages.outputs.base_path != '/'
        # Block scalar: the "User-agent: " below is a colon-space, which YAML
        # would otherwise read as a mapping and reject the whole file.
        run: |
          printf 'User-agent: *\nDisallow: /\n' > ./dist/robots.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


