name: Deploy to GitHub Pages

# Every trigger builds; only the repository's own default branch deploys. That
# is main on esn-skovde/website and new-ui-and-improvements on the a45hif
# preview fork, so the same file is right on both. Any other push, and a manual
# run from any other branch, is a build-only check: pushing a branch to the
# original repo to open its pull request used to end in a deploy the
# github-pages environment rejected, and that failure sat on the PR as a red
# check.
on:
  push:
    branches: [ main, new-ui-and-improvements ]
  # Builds and lints every pull request into main, as a check on the PR.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Read-only unless a job asks for more. Only the deploy job, which never runs
# for a pull request, gets the Pages write and OIDC permissions.
permissions:
  contents: read

env:
    VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A prerender that hangs would otherwise hold the runner for six hours.
    timeout-minutes: 20
    # configure-pages reads this repo's Pages settings, which the token can only
    # do with pages: read. Job-level permissions replace the top-level ones
    # rather than adding to them, so contents: read has to be restated.
    permissions:
      contents: read
      pages: read
    # Per ref: a newer push supersedes an older build of the same branch or
    # pull request, but nothing here can cancel a deploy, which has its own group.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Reports where Pages will actually serve this repo, with the trailing
      # slash stripped: "" at a domain root, custom domains such as esnskovde.org
      # included, and "/<repo>" for a project page. The build needs it, or every
      # asset URL points at the wrong place and the site renders blank. Skipped
      # for pull requests, which publish nothing: with base_path empty they are
      # checked as a root build, the way esnskovde.org itself is built.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build with SSG
        run: npm run build:ssg
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # A root deploy is esnskovde.org itself, and it must never show
          # invented events — if the Supabase secrets go missing there, an empty
          # page is the honest outcome. A project-page deploy is a preview with
          # no secrets, which is the whole reason the sample data exists.
          # configure-pages never reports "/", but it would mean the root too.
          VITE_SAMPLE_DATA: ${{ (steps.pages.outputs.base_path == '' || steps.pages.outputs.base_path == '/') && 'false' || 'true' }}

      # A preview stays out of search through a noindex on every page (see
      # src/components/SEO.jsx), because crawlers only read robots.txt at the
      # root of a host and never the copy under /<repo>/. The robots.txt that
      # counts is the root deploy's, where a "Disallow: /" would take the whole
      # of esnskovde.org out of search.
      - name: Refuse to hide the live site from search
        if: steps.pages.outputs.base_path == '' || steps.pages.outputs.base_path == '/'
        run: |
          if grep -qiE '^[[:space:]]*Disallow:[[:space:]]*/[[:space:]]*$' dist/robots.txt; then
            echo "::error::dist/robots.txt disallows the whole site, which on the root deploy takes esnskovde.org out of search"
            exit 1
          fi

      # github.event.repository is missing from schedule events, so a cron
      # trigger added later has to compare github.ref against a literal branch.
      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # The same gate as the upload step above.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Deploys queue rather than cancel one another, so a newer run can never
    # abort a production deploy halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
