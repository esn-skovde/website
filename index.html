<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom stays enabled: this site is read in a second language by
         most of its audience, and locking scale is a WCAG 1.4.4 failure. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00AEEF" />

    <!-- Static floor for crawlers and the pre-hydration tab label. SEO.jsx sets
         document.title and replaces these in place, so they never duplicate. -->
    <title>ESN Skövde - Erasmus Student Network</title>
    <meta name="description" content="ESN Skövde welcomes international and exchange students in Skövde, Sweden with events, trips and the ESNcard." />

    <!-- %BASE_URL% so these resolve under a project-page base path too. As
         plain "/favicon.ico" they pointed at the domain root, which is not where
         the site lives under a sub-path, and the browser 404'd on it. -->
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo.png" />

    <!-- Kelson Sans is self-hosted (see src/index.css for why). Preload the two
         weights that appear above the fold; 300 is rare and can arrive late. -->
    <link rel="preload" href="%BASE_URL%fonts/kelson-sans-700-normal.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/kelson-sans-400-normal.otf" as="font" type="font/otf" crossorigin />

    <!-- Lato is ESN's secondary face, used for body copy. Only the weights we
         actually set, rather than the full 18-variant family. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Resolve the theme before first paint. Doing this in a React effect
         means a white flash on every cold load for dark-mode visitors.
         color-scheme goes with the class, for the scrollbars and form
         controls. The prerendered pages carry neither (scripts/prerender.js
         takes both out), so this is the only place a visitor gets them before
         the bundle runs. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* private mode — fall back to the light theme */
        }
      })();
    </script>

    <!-- Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages (MIT) -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Scroll reveals start at opacity 0 and are switched on by
         IntersectionObserver. Every route is prerendered to static HTML, so with
         scripting off the content is all present and all invisible — 1824 of the
         1966 words on /new-to-skovde. This hands it back.

         !important is load-bearing here. Tailwind's `@layer components` is a
         build-time directive, not a native CSS cascade layer, so the compiled
         .reveal{opacity:0} is plain unlayered CSS at the same specificity as
         this rule — and Vite injects that stylesheet *after* this block, so on
         document order alone it wins and the page stays blank. -->
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
